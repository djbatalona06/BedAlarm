<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <!-- Set the theme BEFORE first paint so there is no light/dark flash.
         Keep in sync with src/platform/theme.js (the saved copy is written there). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bedalarm-theme');
          if (t !== 'light' && t !== 'dark') t = 'system';
          document.documentElement.setAttribute('data-theme', t);
          var light = t === 'light' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f2f2f7' : '#0b0d17');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'system');
        }
      })();
    </script>
    <meta name="description" content="BedAlarm: an alarm you turn off by scanning your coffee mug and doing a tiny camera-counted morning routine. Free, private, on-device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>BedAlarm</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BedAlarm needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
